version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: relieflink-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-relieflink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relieflink_secret_prod_secure}
      POSTGRES_DB: ${POSTGRES_DB:-relieflink}
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    networks:
      - relieflink-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-relieflink} -d ${POSTGRES_DB:-relieflink}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: relieflink-prod-redis
    restart: always
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-}"
    volumes:
      - prod_redis_data:/data
    networks:
      - relieflink-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: relieflink-prod-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-relieflink}:${POSTGRES_PASSWORD:-relieflink_secret_prod_secure}@postgres:5432/${POSTGRES_DB:-relieflink}?schema=public&connection_limit=50
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-relieflink_prod_jwt_secret_key_change_in_env_secure}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-relieflink_prod_refresh_secret_secure}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      CLIENT_URL: https://relieflink.org
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - relieflink-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: relieflink-prod-web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: https://relieflink.org/api/v1
    depends_on:
      - api
    networks:
      - relieflink-network

  nginx:
    image: nginx:alpine
    container_name: relieflink-prod-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web
      - api
    networks:
      - relieflink-network

networks:
  relieflink-network:
    driver: bridge

volumes:
  prod_postgres_data:
  prod_redis_data:
